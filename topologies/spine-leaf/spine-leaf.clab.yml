name: spine-leaf

topology:
  nodes:
    spine1:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - spine1.conf:/etc/frr/frr.conf

    spine2:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - spine2.conf:/etc/frr/frr.conf

    leaf1:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - leaf1.conf:/etc/frr/frr.conf

    leaf2:
      kind: linux
      image: quay.io/frrouting/frr:9.0.0
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - daemons:/etc/frr/daemons
        - vtysh.conf:/etc/frr/vtysh.conf
        - leaf2.conf:/etc/frr/frr.conf

    host1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.1.1
        - ip route add 10.0.0.0/8 via 192.168.1.1

    host2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.2.1
        - ip route add 10.0.0.0/8 via 192.168.2.1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]